<div class="card border-0 filter-card mb-4">
  <div class="card-body p-3 p-lg-4">
    <div class="row g-3 align-items-end">
      <!-- 1. Search จาก Status -->
      <div class="col-12 col-md-4">
        <label for="statusSelect" class="form-label filter-label">
          <i class="bi bi-funnel-fill me-1 text-navy"></i>สถานะสินค้า
        </label>
        <div class="custom-input-group">
          <select 
            id="statusSelect" 
            class="form-select filter-input" 
            [(ngModel)]="selectedStatus"
            (change)="onSearch()">
            @for (option of statusOptions(); track option) {
              <option [value]="option">{{ option }}</option>
            }
          </select>
        </div>
      </div>

      <!-- 2. Search จาก Order Date (ช่วงวันที่) -->
      <div class="col-12 col-md-5">
        <label class="form-label filter-label">
          <i class="bi bi-calendar-event-fill me-1 text-navy"></i>ช่วงวันที่สั่งซื้อ
        </label>
        <div class="input-group custom-input-group">
          <input 
            type="date" 
            id="startDate" 
            class="form-control filter-input" 
            [(ngModel)]="startDate"
            (change)="onSearch()" 
            aria-label="ตั้งแต่วันที่" />
          <span class="input-group-text date-separator">ถึง</span>
          <input 
            type="date" 
            id="endDate" 
            class="form-control filter-input" 
            [(ngModel)]="endDate"
            (change)="onSearch()" 
            aria-label="ถึงวันที่" />
        </div>
      </div>

      <!-- 3. ปุ่ม Action -->
      <div class="col-12 col-md-3">
        <button 
          type="button" 
          class="btn btn-reset w-100" 
          (click)="onReset()">
          <i class="bi bi-arrow-counterclockwise fs-6"></i>
          <span>ล้างเงื่อนไข</span>
        </button>
      </div>
    </div>
  </div>
</div>
